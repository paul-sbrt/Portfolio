<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Skills — ② Repérage (plaques d'imprimerie · registration snap)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@900&family=JetBrains+Mono:wght@500;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#080808;--text:#fff;--muted:#ababab;--accent:#ff004f;--gold:#f7c948;
    --surface-raised:rgba(255,255,255,.04);--border:rgba(255,255,255,.12);
    --radius-xl:16px;--radius-pill:999px;
    --disp:"Archivo",sans-serif;--mono:"JetBrains Mono",monospace;--body:"Poppins",sans-serif}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .tag{position:fixed;top:12px;left:12px;z-index:30;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);background:rgba(0,0,0,.6);padding:7px 12px;border-radius:20px;max-width:94vw}
  .wrap{max-width:1180px;margin:0 auto;padding:16vh 10% 24vh}
  .eyebrow{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:14px;margin-bottom:20px}
  .eyebrow::before{content:"";width:38px;height:2px;background:linear-gradient(90deg,var(--accent),var(--gold))}
  h2{font-family:var(--disp);font-weight:900;font-size:clamp(30px,4vw,50px);letter-spacing:-.02em;margin-bottom:46px}

  .sheets{display:grid;grid-template-columns:repeat(6,1fr);gap:26px}
  .plate{--c:var(--accent);position:relative;grid-column:span 3;border:1px solid var(--border);background:var(--surface-raised);
    border-radius:var(--radius-xl);padding:26px 24px 22px;view-timeline-name:--plate;view-timeline-axis:block}
  .plate[data-wide]{grid-column:span 6}
  .plate[data-hat="ms"]{--c:var(--gold)}
  /* crop-marks (print-native ornament, not numbering) */
  .plate::before,.plate::after{content:"";position:absolute;width:12px;height:12px;border:1px solid var(--muted);opacity:.5}
  .plate::before{top:9px;left:9px;border-right:0;border-bottom:0}
  .plate::after{bottom:9px;right:9px;border-left:0;border-top:0}
  .pl-name{font-family:var(--mono);font-weight:600;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .pl-name b{display:block;height:2px;width:34px;margin-top:8px;background:linear-gradient(90deg,var(--c),var(--gold))}
  .pl-top{display:flex;flex-wrap:wrap;gap:16px;margin-top:20px}
  /* monogram tile — the 2 flagships as printed initials (no logo needed) */
  .mono{flex:1 1 150px;min-width:140px;border:1px solid color-mix(in srgb,var(--c) 40%,var(--border));border-radius:12px;
    padding:16px 16px 14px;background:color-mix(in srgb,var(--c) 8%,transparent);position:relative;overflow:hidden}
  .glyph{position:relative;height:56px;margin-bottom:10px}
  .glyph .ch{position:absolute;left:0;top:0;font-family:var(--disp);font-weight:900;font-size:54px;line-height:1}
  .glyph .base{color:#fff}
  .glyph .r{color:var(--accent);mix-blend-mode:screen;animation:reg-r linear both;animation-timeline:--plate;animation-range:entry 12% cover 42%}
  .glyph .g{color:var(--gold);mix-blend-mode:screen;animation:reg-g linear both;animation-timeline:--plate;animation-range:entry 12% cover 42%}
  @keyframes reg-r{from{transform:translate(-7px,-4px);filter:blur(3px);opacity:.9}to{transform:none;filter:none;opacity:0}}
  @keyframes reg-g{from{transform:translate(6px,4px);filter:blur(3px);opacity:.9}to{transform:none;filter:none;opacity:0}}
  .mono .lbl{font-size:13.5px;font-weight:500}
  .mono .sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--muted);margin-top:2px}

  /* under-plate = the rest, mis-registered until you "align the layers" */
  .under{position:relative;margin-top:16px;display:flex;flex-wrap:wrap;gap:8px;
    transform:translate(8px,10px);filter:blur(2.5px);opacity:.45;transition:transform .5s cubic-bezier(.22,1,.36,1),filter .5s,opacity .5s}
  .plate.aligned .under{transform:none;filter:none;opacity:1}
  .under .chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border:1px solid var(--border);border-radius:var(--radius-pill);
    background:rgba(255,255,255,.03);font-size:12.5px;line-height:1;min-height:32px;opacity:0;transform:translateY(8px)}
  .plate.aligned .under .chip{opacity:1;transform:none;transition:opacity .4s,transform .4s cubic-bezier(.2,.8,.2,1)}
  .plate.aligned .under .chip:nth-child(n){transition-delay:calc(.05s * var(--i,0))}
  .reg{margin-top:16px;display:inline-flex;align-items:center;gap:9px;font-family:var(--mono);font-size:12px;letter-spacing:.05em;
    color:var(--muted);background:none;border:1px dashed color-mix(in srgb,var(--c) 45%,var(--border));border-radius:var(--radius-pill);
    padding:9px 15px;cursor:pointer;min-height:44px;transition:color .3s,border-color .3s}
  .reg:hover{color:#fff;border-color:var(--c)}
  .reg .ret{display:inline-block;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
  .plate.aligned .reg .ret{transform:rotate(180deg)}
  .reg[hidden]{display:none}

  .rv{opacity:0;transform:translateY(34px);transition:opacity .8s cubic-bezier(.22,1,.36,1),transform .8s cubic-bezier(.22,1,.36,1)}
  .rv.in{opacity:1;transform:none}

  @media(max-width:820px){.sheets{grid-template-columns:1fr}.plate,.plate[data-wide]{grid-column:auto}.under{transform:translate(5px,7px)}}
  @media(prefers-reduced-motion:reduce),(prefers-reduced-motion:no-preference) and (scripting:none){}
  @media(prefers-reduced-motion:reduce){
    .rv{opacity:1;transform:none;transition:none}
    .glyph .r,.glyph .g{animation:none;opacity:0}
    .under{transform:none;filter:none;opacity:1;transition:none}
    .under .chip{opacity:1;transform:none}
  }
</style>
</head>
<body>
  <span class="tag">② Repérage — plaques d'imprimerie · les canaux rose/or se CALENT au scroll · « Aligner les calques » révèle le reste</span>
  <div class="wrap">
    <p class="eyebrow">Compétences — le tirage</p>
    <h2>Cinq plaques.</h2>
    <div class="sheets" id="sheets"></div>
  </div>

<script>
  const INITIAL={"Flutter / Dart":"F","Swift / SwiftUI":"S","Laravel":"L","Next.js":"N","Intégration LLM / Claude":"C","Whisper":"W","Power Apps":"P","Power BI":"B","Figma":"F","Photoshop":"P"};
  const DATA=[
    {name:"Mobile",wide:false,hat:null,featured:["Flutter / Dart","Swift / SwiftUI"],detail:["Firebase"]},
    {name:"Web",wide:true,hat:null,featured:["Laravel","Next.js"],detail:["React","Symfony","WordPress","HTML/CSS","JavaScript","PHP","SQL","Cloudflare Workers"]},
    {name:"IA",wide:false,hat:null,featured:["Intégration LLM / Claude","Whisper"],detail:["Python"]},
    {name:"Microsoft & Power Platform",wide:true,hat:"ms",featured:["Power Apps","Power BI"],detail:["Power Automate","SharePoint","Excel","Azure DevOps"]},
    {name:"Design & Outils",wide:false,hat:null,featured:["Figma","Photoshop"],detail:[]},
  ];
  const sheets=document.getElementById("sheets");
  DATA.forEach(g=>{
    const p=document.createElement("div");
    p.className="plate rv"; if(g.wide)p.dataset.wide="1"; if(g.hat)p.dataset.hat=g.hat;
    const monos=g.featured.map(s=>{const i=INITIAL[s]||s[0];const short=s.split(" / ")[0];
      return `<div class="mono"><div class="glyph"><span class="ch base">${i}</span><span class="ch r">${i}</span><span class="ch g">${i}</span></div><div class="lbl">${short}</div><div class="sub">${s}</div></div>`;}).join("");
    const chips=g.detail.map((s,i)=>`<span class="chip" style="--i:${i}">${s}</span>`).join("");
    const btn=g.detail.length?`<button class="reg" aria-expanded="false"><span class="ret">⊕</span> Aligner les calques · +${g.detail.length}</button>`:"";
    p.innerHTML=`<div class="pl-name">${g.name}<b></b></div><div class="pl-top">${monos}</div>${btn}<div class="under">${chips}</div>`;
    sheets.appendChild(p);
    const b=p.querySelector(".reg");
    if(b)b.addEventListener("click",()=>{const on=p.classList.toggle("aligned");b.setAttribute("aria-expanded",on);});
  });
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}}),{threshold:.15});
  document.querySelectorAll(".rv").forEach(el=>io.observe(el));
</script>
</body>
</html>
