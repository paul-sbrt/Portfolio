<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Skills — ① Mise en Place (cartes-stations · flood disclosure)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;900&family=JetBrains+Mono:wght@500;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#080808;--text:#fff;--muted:#ababab;--accent:#ff004f;--gold:#f7c948;--gold-text:#f7c948;
    --surface-raised:rgba(255,255,255,.04);--border:rgba(255,255,255,.12);--on-accent:#0a0708;
    --radius-xl:16px;--radius-pill:999px;--sp5:24px;--sp4:16px;
    --disp:"Archivo",sans-serif;--mono:"JetBrains Mono",monospace;--body:"Poppins",sans-serif}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .tag{position:fixed;top:12px;left:12px;z-index:30;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);background:rgba(0,0,0,.6);padding:7px 12px;border-radius:20px;max-width:94vw}
  .wrap{max-width:1180px;margin:0 auto;padding:16vh 10% 20vh}
  .eyebrow{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:14px;margin-bottom:20px}
  .eyebrow::before{content:"";width:38px;height:2px;background:linear-gradient(90deg,var(--accent),var(--gold))}
  h2{font-family:var(--disp);font-weight:900;font-size:clamp(30px,4vw,50px);letter-spacing:-.02em;margin-bottom:46px}

  .stations{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp5)}
  .station{--c:var(--accent);position:relative;overflow:hidden;border:1px solid var(--border);background:var(--surface-raised);
    border-radius:var(--radius-xl);padding:22px 22px 20px;isolation:isolate;transition:transform .5s cubic-bezier(.2,.8,.2,1),border-color .5s,box-shadow .5s}
  .station[data-span="2"]{grid-column:span 2}
  .station[data-hat="ms"]{--c:var(--gold)}
  /* flood curtain */
  .station::before{content:"";position:absolute;inset:0;z-index:-1;background:color-mix(in srgb,var(--c) 16%,transparent);
    transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.65,0,.35,1)}
  .station.open{transform:translateY(-8px);border-color:color-mix(in srgb,var(--c) 55%,var(--border));
    box-shadow:0 24px 60px -30px color-mix(in srgb,var(--c) 50%,transparent)}
  .station.open::before{transform:scaleX(1)}
  .st-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;min-height:2.6em}
  .st-glyph{width:34px;height:34px;flex:0 0 auto;border-radius:9px;display:grid;place-items:center;font-family:var(--disp);font-weight:900;
    color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,var(--border));background:color-mix(in srgb,var(--c) 10%,transparent);
    transform:translateY(var(--gfloat,0))}
  .st-name{font-family:var(--mono);font-weight:600;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;line-height:1.3}
  .st-name b{display:block;height:2px;width:0;margin-top:6px;background:linear-gradient(90deg,var(--c),var(--gold));transition:width .6s .2s cubic-bezier(.2,.8,.2,1)}
  .in .st-name b{width:34px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border:1px solid var(--border);border-radius:var(--radius-pill);
    background:rgba(255,255,255,.03);font-size:13px;line-height:1;min-height:34px}
  .chip.flag{border-color:color-mix(in srgb,var(--c) 50%,var(--border));color:#fff;font-weight:500}
  .chip .dot{width:7px;height:7px;border-radius:50%;background:var(--c)}
  .tray{display:flex;flex-wrap:wrap;gap:8px;margin-top:0;max-height:0;opacity:0;overflow:hidden;transition:max-height .5s cubic-bezier(.2,.8,.2,1),opacity .4s,margin-top .5s}
  .station.open .tray{max-height:300px;opacity:1;margin-top:12px}
  .tray .chip{opacity:0;transform:translateY(10px);transition:opacity .4s,transform .4s cubic-bezier(.2,.8,.2,1)}
  .station.open .tray .chip{opacity:1;transform:none}
  .station.open .tray .chip:nth-child(1){transition-delay:.10s}.station.open .tray .chip:nth-child(2){transition-delay:.14s}
  .station.open .tray .chip:nth-child(3){transition-delay:.18s}.station.open .tray .chip:nth-child(4){transition-delay:.22s}
  .station.open .tray .chip:nth-child(5){transition-delay:.26s}.station.open .tray .chip:nth-child(6){transition-delay:.30s}
  .station.open .tray .chip:nth-child(7){transition-delay:.34s}.station.open .tray .chip:nth-child(8){transition-delay:.38s}
  .toggle{margin-top:14px;display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;
    color:var(--muted);background:none;border:none;cursor:pointer;padding:6px 0;min-height:44px}
  .toggle:hover{color:#fff}
  .toggle .pm{color:var(--c);font-weight:600}
  .toggle .arw{transition:transform .4s cubic-bezier(.2,.8,.2,1)}
  .station.open .toggle .arw{transform:rotate(90deg)}
  .toggle[hidden]{display:none}

  /* entrance one-shot */
  .rv{opacity:0;transform:translateY(40px);transition:opacity .8s cubic-bezier(.22,1,.36,1),transform .8s cubic-bezier(.22,1,.36,1)}
  .rv.in{opacity:1;transform:none}
  .stations .rv:nth-child(1){transition-delay:.04s}.stations .rv:nth-child(2){transition-delay:.10s}
  .stations .rv:nth-child(3){transition-delay:.16s}.stations .rv:nth-child(4){transition-delay:.22s}
  .stations .rv:nth-child(5){transition-delay:.28s}

  @media(max-width:820px){.stations{grid-template-columns:1fr}.station[data-span="2"]{grid-column:auto}}
  @media(prefers-reduced-motion:reduce){
    .rv{opacity:1;transform:none;transition:none}
    .station,.station::before,.tray,.tray .chip,.st-name b{transition:none}
    .station.open .tray{max-height:none}.tray .chip{opacity:1;transform:none}
  }
</style>
</head>
<body>
  <span class="tag">① Mise en Place — cartes-stations · le clic déclenche le « flood » et déploie la station (pas d'accordéon)</span>
  <div class="wrap">
    <p class="eyebrow">Compétences — l'atelier</p>
    <h2>Cinq stations.</h2>
    <div class="stations" id="stations"></div>
  </div>

<script>
  // Données = miroir de skill.json (featured = phares posés sur la carte ; le reste = tray)
  const DATA = [
    {name:"Mobile", glyph:"M", span:1, hat:null, featured:["Flutter / Dart","Swift / SwiftUI"], detail:["Firebase"]},
    {name:"Web", glyph:"W", span:2, hat:null, featured:["Laravel","Next.js"], detail:["React","Symfony","WordPress","HTML/CSS","JavaScript","PHP","SQL","Cloudflare Workers"]},
    {name:"IA", glyph:"IA", span:1, hat:null, featured:["Intégration LLM / Claude","Whisper"], detail:["Python"]},
    {name:"Microsoft & Power Platform", glyph:"⊞", span:2, hat:"ms", featured:["Power Apps","Power BI"], detail:["Power Automate","SharePoint","Excel","Azure DevOps"]},
    {name:"Design & Outils", glyph:"D", span:1, hat:null, featured:["Figma","Photoshop"], detail:[]},
  ];
  const grid = document.getElementById("stations");
  DATA.forEach((g,i)=>{
    const card=document.createElement("div");
    card.className="station rv"; card.dataset.span=g.span; if(g.hat)card.dataset.hat=g.hat;
    const flags=g.featured.map(s=>`<span class="chip flag"><span class="dot"></span>${s}</span>`).join("");
    const tray=g.detail.map(s=>`<span class="chip">${s}</span>`).join("");
    const btn=g.detail.length?`<button class="toggle" aria-expanded="false"><span class="arw">▸</span> voir la station · <span class="pm">+${g.detail.length}</span></button>`:"";
    card.innerHTML=`<div class="st-head"><div class="st-glyph">${g.glyph}</div><div class="st-name">${g.name}<b></b></div></div>
      <div class="chips">${flags}</div>${btn}<div class="tray">${tray}</div>`;
    grid.appendChild(card);
    const b=card.querySelector(".toggle");
    if(b)b.addEventListener("click",()=>{const open=card.classList.toggle("open");b.setAttribute("aria-expanded",open);});
  });
  // entrance + eyebrow-bar draw
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}}),{threshold:.2});
  document.querySelectorAll(".rv").forEach(el=>io.observe(el));
  // micro glyph parallax
  addEventListener("scroll",()=>{const y=(scrollY%200)/200-.5;document.querySelectorAll(".st-glyph").forEach(g=>g.style.setProperty("--gfloat",(y*8).toFixed(1)+"px"));},{passive:true});
</script>
</body>
</html>
