<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Projets — G2 « Cartes éditoriales unifiées »</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;900&family=JetBrains+Mono:wght@500;600&family=Poppins:wght@300;400&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#080808;--text:#fff;--muted:#9a949f;--accent:#ff004f;--gold:#f7c948;--border:rgba(255,255,255,.12);
    --surface:rgba(255,255,255,.04);--disp:"Archivo",sans-serif;--mono:"JetBrains Mono",monospace;--body:"Poppins",sans-serif}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .tag{position:fixed;top:12px;left:12px;z-index:30;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);background:rgba(0,0,0,.6);padding:7px 12px;border-radius:20px;max-width:94vw}
  .wrap{max-width:1120px;margin:0 auto;padding:14vh 6% 20vh}
  .eyebrow{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .eyebrow::before{content:"";width:38px;height:2px;background:linear-gradient(90deg,var(--accent),var(--gold))}
  h2{font-family:var(--disp);font-weight:900;font-size:clamp(30px,4.5vw,52px);letter-spacing:-.02em;margin-bottom:30px}
  .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:44px}
  .chip{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:none;border:1px solid var(--border);border-radius:999px;padding:8px 15px;cursor:pointer;transition:color .25s,border-color .25s,background .25s}
  .chip:hover{color:var(--text)}
  .chip.on{color:#0a0708;background:linear-gradient(90deg,var(--accent),var(--gold));border-color:transparent;font-weight:600}

  /* 2 colonnes — cartes amples/premium ; 1 colonne en mobile */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;align-items:start}
  .card{--c:var(--accent);position:relative;display:flex;flex-direction:column;text-decoration:none;color:inherit;overflow:hidden;
    border:1px solid var(--border);border-radius:16px;background:var(--surface);
    transition:transform .5s cubic-bezier(.2,.8,.2,1),border-color .5s,background .5s}
  .card.web{--c:#5a5560} /* neutre : casse le monotone rose */
  /* duotone thumb (couleur projet) + sweep rose→or au hover */
  .card-thumb{position:relative;aspect-ratio:16/9;overflow:hidden;
    background:linear-gradient(135deg,color-mix(in srgb,var(--c) 55%,#0a0708),#0a0708 78%)}
  .card.feat .card-thumb{aspect-ratio:4/3} /* vedettes : vignette plus haute = hiérarchie */
  .card.feat .card-eyebrow{color:color-mix(in srgb,var(--c) 75%,var(--muted))} /* eyebrow teintée marque */
  .card.feat .card-title{font-size:clamp(20px,2.4vw,28px)}
  .card-mesh{position:absolute;inset:0;opacity:.5;
    background:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 1px,transparent 1px 22px)}
  .card-sweep{position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,color-mix(in srgb,var(--gold) 45%,transparent) 48%,color-mix(in srgb,var(--accent) 45%,transparent) 54%,transparent 72%);
    background-size:250% 100%;background-position:130% 0;transition:background-position 1.1s cubic-bezier(.2,.8,.2,1)}
  .card-cap{position:absolute;left:16px;bottom:12px;font-family:var(--disp);font-weight:900;font-size:clamp(22px,3vw,34px);letter-spacing:-.02em;color:#fff;opacity:.92}
  .card-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
  .card-eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .card-title{font-family:var(--disp);font-weight:700;font-size:clamp(18px,2vw,24px);letter-spacing:-.01em;line-height:1.05}
  .card-sum{font-size:13.5px;color:#cfc9d3;font-weight:300}
  .card-foot{margin-top:auto;padding-top:12px;display:flex;align-items:center;justify-content:space-between;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
  .card-arrow{color:var(--c);transition:transform .4s cubic-bezier(.2,.8,.2,1)}
  .card-foot .card-arrow{color:var(--accent)}
  .card::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--gold));transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
  /* HOVER CALMÉ : wash discret + sweep dégradé qui traverse le thumb + liseré ; texte reste blanc */
  @media(hover:hover){
    .card:hover{transform:translateY(-5px);border-color:color-mix(in srgb,var(--c) 45%,var(--border));background:color-mix(in srgb,var(--c) 10%,var(--surface))}
    .card:hover .card-sweep{background-position:-30% 0}
    .card:hover::after{transform:scaleX(1)}
    .card:hover .card-arrow{transform:translate(3px,-3px)}
  }

  .rv{opacity:0;transform:translateY(26px);transition:opacity .7s cubic-bezier(.22,1,.36,1),transform .7s cubic-bezier(.22,1,.36,1)}
  .rv.in{opacity:1;transform:none}
  @supports(animation-timeline:view()){@media(prefers-reduced-motion:no-preference){
    .grid{animation:sect-exit linear both;animation-timeline:view();animation-range:exit 0% exit 90%;animation-fill-mode:forwards}
    @keyframes sect-exit{to{opacity:.1;transform:translateY(-16px) scale(.99);filter:blur(3px)}}
  }}
  @media(max-width:640px){.grid{grid-template-columns:1fr}}
  @media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}.card-sweep{display:none}}
</style>
</head>
<body>
  <span class="tag">G2 — une grille, cartes DA · vedettes span 2 · web en neutre · hover CALMÉ (wash + sweep rose→or, texte blanc)</span>
  <div class="wrap">
    <p class="eyebrow">Projets</p>
    <h2>Mes projets.</h2>
    <div class="filters" id="filters"></div>
    <div class="grid" id="grid"></div>
  </div>
<script>
  const HAT_LABEL={App:"App",IA:"IA",Web:"Web",Microsoft:"Microsoft"};
  fetch("_projects-mini.json").then(r=>r.json()).then(DATA=>{
    const grid=document.getElementById("grid");
    // vedettes d'abord, puis web
    const ordered=[...DATA.filter(p=>p.featured),...DATA.filter(p=>!p.featured)];
    ordered.forEach(p=>{
      const a=document.createElement("a");
      a.className="card rv "+(p.featured?"feat":"web");a.href="#";a.dataset.hats=p.hats.join("|");
      if(p.brand)a.style.setProperty("--c",p.brand);
      const eb=[p.hats.join(" · "),p.year].filter(Boolean).join(" · ");
      const line=p.tagline||p.summary||"";
      a.innerHTML=`<div class="card-thumb"><div class="card-mesh"></div><div class="card-sweep"></div><div class="card-cap">${p.title}</div></div>`+
        `<div class="card-body"><div class="card-eyebrow">${eb}</div>`+
        `<div class="card-title">${p.title}</div>`+
        (line?`<p class="card-sum">${line}</p>`:"")+
        `<div class="card-foot"><span>${p.hats.join(" · ")||""}</span><span class="card-arrow">${p.featured?"→":"↗"}</span></div></div>`;
      grid.appendChild(a);
    });
    const hats=["Tous",...Array.from(new Set(DATA.flatMap(p=>p.hats)))];
    const fbox=document.getElementById("filters");
    hats.forEach((h,i)=>{const b=document.createElement("button");b.className="chip"+(i===0?" on":"");b.textContent=(h==="Tous")?"Tous":(HAT_LABEL[h]||h);b.dataset.f=h;fbox.appendChild(b);});
    fbox.addEventListener("click",e=>{const f=e.target.dataset.f;if(!f)return;
      document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c.dataset.f===f));
      [...grid.children].forEach(el=>{const hs=(el.dataset.hats||"").split("|");el.style.display=(f==="Tous"||hs.includes(f))?"":"none";});
    });
    const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}}),{threshold:.12});
    document.querySelectorAll(".rv").forEach((el,i)=>{el.style.transitionDelay=(0.03+(i%8)*0.05).toFixed(2)+"s";io.observe(el);});
  });
</script>
</body>
</html>
