<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Skills ③ — Révélation « Seuil » (corrigé : balayage rose→or, texte final blanc lisible)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;900&family=JetBrains+Mono:wght@500;600&family=Poppins:wght@300;400&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#080808;--text:#fff;--muted:#ababab;--accent:#ff004f;--gold:#f7c948;--border:rgba(255,255,255,.12);
    --disp:"Archivo",sans-serif;--mono:"JetBrains Mono",monospace;--body:"Poppins",sans-serif}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .tag{position:fixed;top:12px;left:12px;z-index:30;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);background:rgba(0,0,0,.6);padding:7px 12px;border-radius:20px;max-width:94vw}
  .wrap{max-width:1180px;margin:0 auto;padding:15vh 10% 24vh}
  .eyebrow{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:14px;margin-bottom:20px}
  .eyebrow::before{content:"";width:38px;height:2px;background:linear-gradient(90deg,var(--accent),var(--gold))}
  h2{font-family:var(--disp);font-weight:900;font-size:clamp(28px,4vw,46px);letter-spacing:-.02em;margin-bottom:38px}

  .bands{border-top:1px solid var(--border)}
  /* Fil rouge rose->or POUR TOUS ; seule exception : Microsoft en OR (convention hat). */
  .band{--c:var(--accent);padding:26px 0 24px;border-bottom:1px solid var(--border);view-timeline-name:--band;view-timeline-axis:block;cursor:pointer;transition:opacity .45s;outline:none}
  .band[data-hat="ms"]{--c:var(--gold)}
  .band:focus-visible{outline:2px solid var(--c);outline-offset:6px;border-radius:6px}
  .b-eyebrow{font-family:var(--mono);font-weight:600;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .b-eyebrow::before{content:"";width:26px;height:2px;background:linear-gradient(90deg,var(--c),var(--gold))}
  .line{font-family:var(--disp);font-weight:900;font-size:clamp(26px,5.2vw,58px);line-height:1.02;letter-spacing:-.02em;display:flex;flex-wrap:wrap;gap:.35em;align-items:baseline;will-change:transform}
  .line .anchor{background:linear-gradient(110deg,var(--c),var(--gold) 42%,#fff2cf 50%,var(--gold) 58%,var(--c));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
  .line .sep{color:var(--muted);font-weight:700;font-size:.5em;align-self:center}

  /* ===== INVITATION au repos ===== */
  .invite{margin-top:16px;display:inline-flex;align-items:center;gap:10px;height:22px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--muted);transition:opacity .4s ease,transform .5s cubic-bezier(.22,1,.36,1)}
  .invite .n{font-weight:600;background:linear-gradient(90deg,var(--c),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
  .invite .rule{width:26px;height:2px;background:linear-gradient(90deg,var(--c),var(--gold));transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .invite .txt{text-transform:uppercase}
  .invite .arw{color:var(--c);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
  .band:hover .invite,.band:focus-visible .invite,.band.lit .invite{opacity:0;transform:translateY(-4px)}
  .band:hover .invite .rule{width:44px}

  /* ===== DÉTAIL caché → révélé (grid-rows, pas de saut) ===== */
  .detail{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s cubic-bezier(.2,.8,.2,1)}
  .band:hover .detail,.band:focus-visible .detail,.band.lit .detail{grid-template-rows:1fr}
  .detail>.inner{min-height:0;overflow:hidden}
  .row{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px 24px;padding-top:6px}

  /* ===== Chaque secondaire =====
     EFFET de révélation : un balayage rose->or traverse le mot (background-position).
     ÉTAT FINAL : texte BLANC net (le gradient a du blanc à ses deux extrémités,
     donc au repos révélé le texte est blanc lisible ; la couleur ne fait que PASSER).
     La couleur qui reste vit dans le SOULIGNÉ (::after), pas dans le texte. */
  .g{position:relative;font-family:var(--mono);font-weight:500;font-size:13.5px;letter-spacing:.06em;padding-bottom:7px;
     background:linear-gradient(100deg,#ffffff 0 44%,var(--c) 48%,#fff2cf 51%,var(--gold) 54%,#ffffff 58% 100%);
     background-size:300% 100%;background-position:100% 0;
     -webkit-background-clip:text;background-clip:text;color:#fff;-webkit-text-fill-color:transparent;
     transform:translateY(9px);
     transition:background-position .95s cubic-bezier(.2,.8,.2,1),transform .55s cubic-bezier(.22,1,.36,1)}
  .g::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:2px;transform:scaleX(0);transform-origin:left;
     background:linear-gradient(90deg,var(--c),var(--gold));transition:transform .55s cubic-bezier(.2,.8,.2,1)}
  /* reveal : the colour band sweeps through (100% -> 0%) and settles on WHITE */
  .band:hover .g,.band:focus-visible .g,.band.lit .g{background-position:0 0;transform:none}
  .band:hover .g::after,.band:focus-visible .g::after,.band.lit .g::after{transform:scaleX(1)}
  .g:nth-child(1){transition-delay:.05s}.g:nth-child(1)::after{transition-delay:.07s}
  .g:nth-child(2){transition-delay:.11s}.g:nth-child(2)::after{transition-delay:.13s}
  .g:nth-child(3){transition-delay:.17s}.g:nth-child(3)::after{transition-delay:.19s}
  .g:nth-child(4){transition-delay:.23s}.g:nth-child(4)::after{transition-delay:.25s}
  .g:nth-child(5){transition-delay:.29s}.g:nth-child(5)::after{transition-delay:.31s}
  .g:nth-child(6){transition-delay:.35s}.g:nth-child(6)::after{transition-delay:.37s}
  .g:nth-child(7){transition-delay:.41s}.g:nth-child(7)::after{transition-delay:.43s}
  .g:nth-child(8){transition-delay:.47s}.g:nth-child(8)::after{transition-delay:.49s}

  @supports (animation-timeline: view()){@media (prefers-reduced-motion:no-preference){
    .line{animation:drift linear both;animation-timeline:--band;animation-range:cover 0% cover 100%}
    .band:nth-child(even) .line{animation-name:driftr}
    @keyframes drift{from{transform:translateX(-2vw)}to{transform:translateX(2vw)}}
    @keyframes driftr{from{transform:translateX(2vw)}to{transform:translateX(-2vw)}}
    .line .anchor{animation:sweep linear both;animation-timeline:--band;animation-range:entry 20% cover 60%}
    @keyframes sweep{from{background-position:160% 0}to{background-position:-60% 0}}
  }}
  .rv{opacity:0;transform:translateY(30px);transition:opacity .8s cubic-bezier(.22,1,.36,1),transform .8s cubic-bezier(.22,1,.36,1)}
  .rv.in{opacity:1;transform:none}
  @media(max-width:820px){.line{font-size:clamp(22px,7vw,30px)}.row{gap:12px 18px}}
  @media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}
    .detail{grid-template-rows:1fr}.invite{display:none}
    .g{background-position:0 0;transform:none;transition:none}.g::after{transform:scaleX(1);transition:none}}
</style>
</head>
<body>
  <span class="tag">③ « Seuil » corrigé — fil rouge rose→or partout (Microsoft en or) · balayage à la révélation, texte final BLANC lisible, couleur dans le souligné</span>
  <div class="wrap">
    <p class="eyebrow">Compétences — sur la ligne</p>
    <h2>Seuil · corrigé.</h2>
    <div class="bands" id="bands"></div>
  </div>
<script>
  const DATA=[
    {name:"Mobile",hat:null,featured:["Flutter","Swift"],detail:["Dart","Firebase"]},
    {name:"Web",hat:null,featured:["Laravel","Next.js","React"],detail:["Symfony","WordPress","HTML/CSS","JavaScript","PHP","SQL","Cloudflare Workers"]},
    {name:"IA",hat:null,featured:["Claude","Whisper"],detail:["Python"]},
    {name:"Microsoft & Power Platform",hat:"ms",featured:["Power Apps","Power BI"],detail:["Power Automate","SharePoint","Excel","Azure DevOps"]},
    {name:"Design & Outils",hat:null,featured:["Figma","Photoshop"],detail:[]},
  ];
  const bands=document.getElementById("bands");
  DATA.forEach(g=>{
    const el=document.createElement("div");el.className="band rv";if(g.hat)el.dataset.hat=g.hat;
    if(g.detail.length){el.tabIndex=0;el.setAttribute("role","button");el.setAttribute("aria-expanded","false");el.setAttribute("aria-label",g.name+" — révéler le détail");}
    const line=g.featured.map((s,i)=>`<span class="sk ${i===0?'anchor':''}">${s}</span>`).join('<span class="sep">/</span>');
    const words=g.detail.map(s=>`<span class="g">${s}</span>`).join("");
    const invite=g.detail.length?`<div class="invite"><span class="rule"></span><span class="n">+${g.detail.length}</span><span class="txt">voir plus</span><span class="arw">→</span></div>`:"";
    const detail=g.detail.length?`<div class="detail"><div class="inner"><div class="row">${words}</div></div></div>`:"";
    el.innerHTML=`<div class="b-eyebrow">${g.name}</div><div class="line">${line}</div>${invite}${detail}`;
    bands.appendChild(el);
    if(g.detail.length){const t=()=>{const on=el.classList.toggle("lit");el.setAttribute("aria-expanded",on);};
      el.addEventListener("click",t);el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();t();}});}
  });
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}}),{threshold:.2});
  document.querySelectorAll(".rv").forEach(el=>io.observe(el));
</script>
</body>
</html>
