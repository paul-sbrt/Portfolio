<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Projets — G1 « Vedettes en tête + index Web »</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;900&family=JetBrains+Mono:wght@500;600&family=Poppins:wght@300;400&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#080808;--text:#fff;--muted:#9a949f;--accent:#ff004f;--gold:#f7c948;--border:rgba(255,255,255,.12);
    --surface:rgba(255,255,255,.04);--disp:"Archivo",sans-serif;--mono:"JetBrains Mono",monospace;--body:"Poppins",sans-serif}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .tag{position:fixed;top:12px;left:12px;z-index:30;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);background:rgba(0,0,0,.6);padding:7px 12px;border-radius:20px;max-width:94vw}
  .wrap{max-width:1180px;margin:0 auto;padding:14vh 8% 20vh}
  .eyebrow{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .eyebrow::before{content:"";width:38px;height:2px;background:linear-gradient(90deg,var(--accent),var(--gold))}
  h2{font-family:var(--disp);font-weight:900;font-size:clamp(30px,4.5vw,52px);letter-spacing:-.02em;margin-bottom:30px}

  /* filters */
  .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:44px}
  .chip{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
    background:none;border:1px solid var(--border);border-radius:999px;padding:8px 15px;cursor:pointer;transition:color .25s,border-color .25s,background .25s}
  .chip:hover{color:var(--text)}
  .chip.on{color:#0a0708;background:linear-gradient(90deg,var(--accent),var(--gold));border-color:transparent;font-weight:600}

  .band{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
    display:flex;align-items:center;gap:12px;margin:8px 0 22px}
  .band::before{content:"";width:24px;height:2px;background:linear-gradient(90deg,var(--accent),var(--gold))}

  /* ===== Vedettes : grandes cartes ===== */
  .feats{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:70px}
  .feat{--c:var(--accent);position:relative;display:block;text-decoration:none;color:inherit;overflow:hidden;
    border:1px solid var(--border);border-radius:16px;background:var(--surface);padding:24px 24px 22px 26px;
    transition:transform .5s cubic-bezier(.2,.8,.2,1),border-color .5s,background .5s}
  .feat::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:3px;border-radius:3px;background:var(--c)} /* accent fin = couleur projet */
  .feat::after{content:"";position:absolute;left:26px;right:24px;bottom:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--gold));transform:scaleX(0);transform-origin:left;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
  .feat-eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
  .feat-title{font-family:var(--disp);font-weight:900;font-size:clamp(26px,3vw,38px);letter-spacing:-.02em;line-height:1}
  .feat-line{margin-top:10px;font-size:14.5px;color:#d7d2da;font-weight:300;max-width:44ch}
  .feat-stack{margin-top:16px;font-family:var(--mono);font-size:11.5px;letter-spacing:.03em;color:var(--muted)}
  .feat-arrow{position:absolute;top:22px;right:22px;font-family:var(--mono);color:var(--c);font-size:16px;transition:transform .4s cubic-bezier(.2,.8,.2,1)}
  /* HOVER CALMÉ : wash discret (~12%) + liseré rose→or + texte reste blanc */
  @media(hover:hover){
    .feat:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--c) 45%,var(--border));
      background:color-mix(in srgb,var(--c) 12%,var(--surface))}
    .feat:hover::after{transform:scaleX(1)}
    .feat:hover .feat-arrow{transform:translate(3px,-3px)}
  }

  /* ===== Index Web : lignes façon registre, NEUTRE ===== */
  .idx-list{border-top:1px solid var(--border)}
  .idx{position:relative;display:flex;align-items:baseline;gap:20px;padding:18px 2px;text-decoration:none;color:inherit;border-bottom:1px solid var(--border);transition:padding-left .35s cubic-bezier(.2,.8,.2,1)}
  .idx-head{flex:1 1 auto;min-width:0}
  .idx-title{font-family:var(--disp);font-weight:700;font-size:clamp(17px,2vw,22px);letter-spacing:-.01em;transition:color .3s}
  .idx-line{margin-top:5px;font-family:var(--mono);font-size:12px;letter-spacing:.02em;color:var(--muted)}
  .idx-meta{flex:0 0 auto;font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--muted);align-self:center}
  .idx-arrow{flex:0 0 auto;font-family:var(--mono);color:var(--accent);align-self:center;opacity:0;transform:translateX(-4px);transition:opacity .3s,transform .4s cubic-bezier(.2,.8,.2,1)}
  .idx::before{content:"";position:absolute;left:0;top:0;bottom:-1px;width:2px;background:linear-gradient(180deg,var(--accent),var(--gold));transform:scaleY(0);transform-origin:top;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
  @media(hover:hover){
    .idx:hover{padding-left:16px}
    .idx:hover::before{transform:scaleY(1)}
    .idx:hover .idx-title{color:#fff}
    .idx:hover .idx-arrow{opacity:1;transform:none}
  }

  /* entrée cascade + sortie section */
  .rv{opacity:0;transform:translateY(26px);transition:opacity .7s cubic-bezier(.22,1,.36,1),transform .7s cubic-bezier(.22,1,.36,1)}
  .rv.in{opacity:1;transform:none}
  @supports(animation-timeline:view()){@media(prefers-reduced-motion:no-preference){
    .feats,.idx-list{animation:sect-exit linear both;animation-timeline:view();animation-range:exit 0% exit 90%;animation-fill-mode:forwards}
    @keyframes sect-exit{to{opacity:.1;transform:translateY(-16px) scale(.99);filter:blur(3px)}}
  }}
  @media(max-width:760px){.feats{grid-template-columns:1fr}}
  @media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}}
</style>
</head>
<body>
  <span class="tag">G1 — vedettes en grandes cartes + 19 web en index · hover CALMÉ (wash ~12% + liseré rose→or, texte blanc)</span>
  <div class="wrap">
    <p class="eyebrow">Projets</p>
    <h2>Mes projets.</h2>
    <div class="filters" id="filters"></div>
    <p class="band" id="band-feat">En vedette</p>
    <div class="feats" id="feats"></div>
    <p class="band" id="band-idx">Autres projets</p>
    <div class="idx-list" id="idx"></div>
  </div>
<script>
  const HAT_LABEL={App:"App",IA:"IA",Web:"Web",Microsoft:"Microsoft"};
  fetch("_projects-mini.json").then(r=>r.json()).then(DATA=>{
    const feats=document.getElementById("feats"), idx=document.getElementById("idx");
    const featured=DATA.filter(p=>p.featured), web=DATA.filter(p=>!p.featured);

    featured.forEach(p=>{
      const a=document.createElement("a");a.className="feat rv";a.href="#";a.dataset.hats=p.hats.join("|");
      if(p.brand)a.style.setProperty("--c",p.brand);
      const eb=[p.hats.join(" · "),p.year].filter(Boolean).join(" · ");
      const stack=(p.tags||[]).slice(0,5).join(" · ");
      a.innerHTML=`<span class="feat-arrow">→</span><div class="feat-eyebrow">${eb}</div>`+
        `<div class="feat-title">${p.title}</div>`+
        (p.tagline?`<p class="feat-line">${p.tagline}</p>`:"")+
        (stack?`<div class="feat-stack">${stack}</div>`:"");
      feats.appendChild(a);
    });
    web.forEach(p=>{
      const a=document.createElement("a");a.className="idx rv";a.href="#";a.dataset.hats=p.hats.join("|");
      const meta=p.hats.join(" · ")||"";
      a.innerHTML=`<div class="idx-head"><span class="idx-title">${p.title}</span>`+
        (p.summary?`<div class="idx-line">${p.summary}</div>`:"")+`</div>`+
        `<span class="idx-meta">${meta}</span><span class="idx-arrow">↗</span>`;
      idx.appendChild(a);
    });

    // filters
    const hats=["Tous",...Array.from(new Set(DATA.flatMap(p=>p.hats)))];
    const fbox=document.getElementById("filters");
    hats.forEach((h,i)=>{const b=document.createElement("button");b.className="chip"+(i===0?" on":"");b.textContent=(h==="Tous")?"Tous":(HAT_LABEL[h]||h);b.dataset.f=h;fbox.appendChild(b);});
    function apply(f){
      document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c.dataset.f===f));
      [...document.querySelectorAll(".feat,.idx")].forEach(el=>{
        const hs=(el.dataset.hats||"").split("|");
        el.style.display=(f==="Tous"||hs.includes(f))?"":"none";
      });
      document.getElementById("band-feat").style.display=[...feats.children].some(c=>c.style.display!=="none")?"":"none";
      document.getElementById("band-idx").style.display=[...idx.children].some(c=>c.style.display!=="none")?"":"none";
    }
    fbox.addEventListener("click",e=>{if(e.target.dataset.f)apply(e.target.dataset.f);});

    const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}}),{threshold:.12});
    document.querySelectorAll(".rv").forEach((el,i)=>{el.style.transitionDelay=(0.03+ (i%8)*0.05).toFixed(2)+"s";io.observe(el);});
  });
</script>
</body>
</html>
