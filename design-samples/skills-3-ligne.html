<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Skills — ③ Sur la Ligne (typo-interface · bandes tickets de passe)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;900&family=JetBrains+Mono:wght@500;600&family=Poppins:wght@300;400&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#080808;--text:#fff;--muted:#ababab;--accent:#ff004f;--gold:#f7c948;
    --surface-raised:rgba(255,255,255,.04);--border:rgba(255,255,255,.12);
    --radius-pill:999px;
    --disp:"Archivo",sans-serif;--mono:"JetBrains Mono",monospace;--body:"Poppins",sans-serif}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .tag{position:fixed;top:12px;left:12px;z-index:30;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);background:rgba(0,0,0,.6);padding:7px 12px;border-radius:20px;max-width:94vw}
  .wrap{max-width:1180px;margin:0 auto;padding:16vh 10% 24vh}
  .eyebrow{font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:14px;margin-bottom:20px}
  .eyebrow::before{content:"";width:38px;height:2px;background:linear-gradient(90deg,var(--accent),var(--gold))}
  h2{font-family:var(--disp);font-weight:900;font-size:clamp(30px,4vw,50px);letter-spacing:-.02em;margin-bottom:40px}

  .bands{border-top:1px solid var(--border)}
  .band{--c:var(--accent);padding:30px 0;border-bottom:1px solid var(--border);view-timeline-name:--band;view-timeline-axis:block;
    transition:opacity .45s ease}
  .band[data-hat="ms"]{--c:var(--gold)}
  .b-eyebrow{font-family:var(--mono);font-weight:600;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
    display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .b-eyebrow::before{content:"";width:26px;height:2px;background:linear-gradient(90deg,var(--c),var(--gold))}
  .line{font-family:var(--disp);font-weight:900;font-size:clamp(26px,5.4vw,60px);line-height:1.02;letter-spacing:-.02em;
    display:flex;flex-wrap:wrap;gap:.35em;align-items:baseline;transition:transform .5s,opacity .45s;will-change:transform}
  .line .sk{color:#fff;transition:color .4s}
  .line .anchor{background:linear-gradient(110deg,var(--c) 0%,var(--gold) 42%,#fff2cf 50%,var(--gold) 58%,var(--c) 100%);
    background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
  .line .sep{color:var(--muted);font-weight:700;font-size:.5em;align-self:center}
  .trigger{margin-top:16px;display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;letter-spacing:.05em;
    color:var(--muted);background:none;border:none;cursor:pointer;padding:8px 0;min-height:44px}
  .trigger:hover{color:#fff}.trigger .pm{color:var(--c);font-weight:600}
  .trigger .arw{transition:transform .4s cubic-bezier(.2,.8,.2,1)}
  .band.open .trigger .arw{transform:translateX(4px)}
  .trigger[hidden]{display:none}
  /* lateral shelf — slides in, NOT an accordion push */
  .shelf{margin-top:6px;display:flex;flex-wrap:wrap;gap:8px;max-height:0;overflow:hidden;transition:max-height .5s cubic-bezier(.2,.8,.2,1)}
  .band.open .shelf{max-height:160px}
  .shelf .chip{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border:1px solid var(--border);border-radius:var(--radius-pill);
    background:rgba(255,255,255,.03);font-family:var(--body);font-size:13px;line-height:1;min-height:32px;
    opacity:0;transform:translateX(-14px);clip-path:inset(0 100% 0 0)}
  .band.open .shelf .chip{opacity:1;transform:none;clip-path:inset(0 0 0 0);transition:opacity .4s,transform .45s cubic-bezier(.2,.8,.2,1),clip-path .45s cubic-bezier(.2,.8,.2,1)}
  .band.open .shelf .chip:nth-child(n){transition-delay:calc(.04s * var(--i,0))}

  /* focus-pull : hovering one band recedes the others (depth of field) */
  .bands:hover .band{opacity:.4}
  .bands:hover .band:hover{opacity:1}
  .bands:hover .band:hover .line{transform:scale(1.015)}

  /* scroll-scrubbed drift + anchor sweep (one notch richer, same family) */
  @supports (animation-timeline: view()){
    @media (prefers-reduced-motion: no-preference){
      .line{animation:drift linear both;animation-timeline:--band;animation-range:cover 0% cover 100%}
      .band:nth-child(even) .line{animation-name:drift-rev}
      @keyframes drift{from{transform:translateX(-2.2vw)}to{transform:translateX(2.2vw)}}
      @keyframes drift-rev{from{transform:translateX(2.2vw)}to{transform:translateX(-2.2vw)}}
      .line .anchor{animation:sweep linear both;animation-timeline:--band;animation-range:entry 20% cover 60%}
      @keyframes sweep{from{background-position:160% 0}to{background-position:-60% 0}}
    }
  }

  .rv{opacity:0;transform:translateY(30px);transition:opacity .8s cubic-bezier(.22,1,.36,1),transform .8s cubic-bezier(.22,1,.36,1)}
  .rv.in{opacity:1;transform:none}

  @media(max-width:820px){
    .line{font-size:clamp(22px,7vw,30px)}
    .bands:hover .band,.bands:hover .band:hover .line{opacity:1;transform:none} /* no focus-pull on touch */
  }
  @media(prefers-reduced-motion:reduce){
    .rv{opacity:1;transform:none;transition:none}
    .shelf .chip{opacity:1;transform:none;clip-path:none}
    .band.open .shelf{max-height:none}
  }
</style>
</head>
<body>
  <span class="tag">③ Sur la Ligne — les phares sont la TYPO (pas d'icône) · +N ouvre un shelf latéral · au scroll les lignes défilent + flash rose→or</span>
  <div class="wrap">
    <p class="eyebrow">Compétences — sur la ligne</p>
    <h2>Sur la ligne.</h2>
    <div class="bands" id="bands"></div>
  </div>

<script>
  const DATA=[
    {name:"Mobile",hat:null,featured:["Flutter","Swift"],detail:["Dart","Firebase"]},
    {name:"Web",hat:null,featured:["Laravel","Next.js","React"],detail:["Symfony","WordPress","HTML/CSS","JavaScript","PHP","SQL","Cloudflare Workers"]},
    {name:"IA",hat:null,featured:["Claude","Whisper"],detail:["Python"]},
    {name:"Microsoft & Power Platform",hat:"ms",featured:["Power Apps","Power BI"],detail:["Power Automate","SharePoint","Excel","Azure DevOps"]},
    {name:"Design & Outils",hat:null,featured:["Figma","Photoshop"],detail:[]},
  ];
  const bands=document.getElementById("bands");
  DATA.forEach(g=>{
    const el=document.createElement("div");
    el.className="band rv"; if(g.hat)el.dataset.hat=g.hat;
    const line=g.featured.map((s,i)=>`<span class="sk ${i===0?'anchor':''}">${s}</span>`).join('<span class="sep">/</span>');
    const chips=g.detail.map((s,i)=>`<span class="chip" style="--i:${i}">${s}</span>`).join("");
    const btn=g.detail.length?`<button class="trigger" aria-expanded="false">+${g.detail.length} · voir tout <span class="arw">→</span></button>`:"";
    el.innerHTML=`<div class="b-eyebrow">${g.name}</div><div class="line">${line}</div>${btn}<div class="shelf">${chips}</div>`;
    bands.appendChild(el);
    const b=el.querySelector(".trigger");
    if(b)b.addEventListener("click",()=>{const on=el.classList.toggle("open");b.setAttribute("aria-expanded",on);});
  });
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}}),{threshold:.2});
  document.querySelectorAll(".rv").forEach(el=>io.observe(el));
</script>
</body>
</html>
