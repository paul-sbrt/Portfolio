<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Direction B — Duotone graphique</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=Poppins:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0a0708; --text:#fdfdfd; --muted:#a09aa0;
    --pink:#ff004f; --gold:#f7c948;
    --disp:"Archivo",sans-serif; --body:"Poppins",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:var(--body);min-height:100vh;overflow-x:hidden}
  .wrap{max-width:1240px;margin:0 auto;padding:0 32px}
  .top{display:flex;justify-content:space-between;align-items:center;padding:26px 0;font-size:14px}
  .top .name{font-family:var(--disp);font-weight:700;letter-spacing:-.01em}
  .top .name span{color:var(--pink)}
  .top .avail{color:var(--muted)}.top .avail b{color:var(--gold);font-weight:500}
  .hero{position:relative;padding:8vh 0 6vh;display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center}
  .eyebrow{font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--pink);margin-bottom:22px}
  h1{font-family:var(--disp);font-weight:900;font-size:clamp(46px,9vw,120px);line-height:.92;letter-spacing:-.03em;text-transform:uppercase}
  h1 .g{color:transparent;-webkit-text-stroke:2px var(--gold)}
  h1 .p{color:var(--pink)}
  .sub{margin-top:26px;max-width:46ch;color:#d3ced3;font-size:18px;line-height:1.6}
  /* signature: duotone panel — the brand bichromy as a graphic object */
  .panel{position:relative;aspect-ratio:4/5;border-radius:20px;overflow:hidden;isolation:isolate}
  .panel .mesh{position:absolute;inset:0;
    background:
      radial-gradient(60% 60% at 20% 15%,var(--pink),transparent 60%),
      radial-gradient(55% 55% at 85% 80%,var(--gold),transparent 60%),
      linear-gradient(135deg,#12060a,#0a0708);
    filter:saturate(1.1);animation:drift 14s ease-in-out infinite alternate}
  .panel .grain{position:absolute;inset:0;mix-blend-mode:overlay;opacity:.5;
    background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px)}
  .panel .plabel{position:absolute;left:20px;bottom:18px;font-family:var(--disp);font-weight:900;font-size:34px;
    text-transform:uppercase;letter-spacing:-.02em;color:#0a0708;mix-blend-mode:screen}
  .panel .ptag{position:absolute;left:22px;top:20px;font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.14em;color:#0a0708;background:var(--gold);padding:5px 10px;border-radius:20px}
  @keyframes drift{to{transform:scale(1.08) translate(-2%, -2%)}}
  h1,.eyebrow,.sub,.panel{opacity:0;transform:translateY(24px);animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards}
  .eyebrow{animation-delay:.05s}h1{animation-delay:.12s}.sub{animation-delay:.24s}.panel{animation-delay:.2s}
  @keyframes rise{to{opacity:1;transform:none}}
  @media(max-width:860px){.hero{grid-template-columns:1fr}.panel{max-width:360px}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
</style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="name">PAUL<span>.</span>SABOURAULT</div>
      <div class="avail">Développeur · <b>en recherche d'alternance</b></div>
    </div>
    <section class="hero">
      <div>
        <p class="eyebrow">Mobile — Web — IA — Microsoft</p>
        <h1>Je <span class="p">construis</span> de vrais <span class="g">trucs</span> et j'apprends.</h1>
        <p class="sub">Je conçois, je code, je déploie — solo comme en entreprise. De l'app iOS boostée à l'IA au site qui vend une solution Microsoft.</p>
      </div>
      <div class="panel">
        <div class="mesh"></div><div class="grain"></div>
        <span class="ptag">iOS · IA</span>
        <span class="plabel">DUMP</span>
      </div>
    </section>
  </div>
</body>
</html>
