<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tabs — A « Filet » (typo seule, filet rose→or qui glisse)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;900&family=JetBrains+Mono:wght@500;600&family=Poppins:wght@300;400&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#080808;--text:#fff;--muted:#8f8994;--accent:#ff004f;--gold:#f7c948;--border:rgba(255,255,255,.12);
    --disp:"Archivo",sans-serif;--mono:"JetBrains Mono",monospace;--body:"Poppins",sans-serif}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .tag{position:fixed;top:12px;left:12px;z-index:30;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);background:rgba(0,0,0,.6);padding:7px 12px;border-radius:20px;max-width:94vw}
  .wrap{max-width:1180px;margin:0 auto;padding:16vh 10% 20vh}
  h2{font-family:var(--disp);font-weight:900;font-size:clamp(26px,4vw,42px);letter-spacing:-.02em;margin-bottom:44px}

  /* ===== A — Filet : les 4 onglets en TYPO seule sur un filet ; l'actif est repéré
     par un souligné rose→or qui GLISSE (largeur = celle du label), comme un scroll-spy. ===== */
  .tabs{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:38px;border-bottom:1px solid var(--border)}
  .tab{position:relative;background:none;border:none;cursor:pointer;font-family:var(--mono);font-weight:600;
    font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:2px 2px 18px;transition:color .3s ease}
  .tab:hover{color:var(--text)}
  .tab.active{color:var(--text)}
  .ind{position:absolute;bottom:-1px;left:0;height:2px;border-radius:2px;opacity:0;
    background:linear-gradient(90deg,var(--accent),var(--gold));
    transition:transform .42s cubic-bezier(.2,.8,.2,1),width .42s cubic-bezier(.2,.8,.2,1),opacity .3s ease}
  .tab:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:4px}

  .panel{margin-top:40px;font-family:var(--mono);font-size:13px;letter-spacing:.04em;color:var(--muted);min-height:60px}
  .panel b{color:var(--text);font-weight:600}
  @media(prefers-reduced-motion:reduce){.ind{transition:none}}
</style>
</head>
<body>
  <span class="tag">A « Filet » — typo seule, filet rose→or qui glisse sous l'actif (clique les onglets)</span>
  <div class="wrap">
    <h2>Sélecteur — variante A.</h2>
    <div class="tabs" id="tabs" role="tablist">
      <span class="ind" id="ind" aria-hidden="true"></span>
      <button class="tab active" role="tab">Compétences</button>
      <button class="tab" role="tab">Expérience</button>
      <button class="tab" role="tab">Études</button>
      <button class="tab" role="tab">Certifications</button>
    </div>
    <div class="panel" id="panel"></div>
  </div>
<script>
  const tabs=[...document.querySelectorAll(".tab")], ind=document.getElementById("ind"), panel=document.getElementById("panel");
  let active=0;
  const demo=["Contenu <b>Compétences</b> (design ③ ici).","Contenu <b>Expérience</b>.","Contenu <b>Études</b>.","Contenu <b>Certifications</b>."];
  function place(){const t=tabs[active];ind.style.width=t.offsetWidth+"px";ind.style.transform="translateX("+t.offsetLeft+"px)";ind.style.opacity="1";}
  function select(i){active=i;tabs.forEach((t,k)=>t.classList.toggle("active",k===i));panel.innerHTML=demo[i];place();}
  tabs.forEach((t,i)=>t.addEventListener("click",()=>select(i)));
  select(0);
  addEventListener("resize",place);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(place);
</script>
</body>
</html>
